afterEach:
  - recordToReport: VideoBoundary final assertion evidence, including failures
cases:
  - name: xelement/VideoBoundary
    steps:
      - recordToReport:
          title: Start isolated Explorer for VideoBoundary
      - wait:
          duration: 5000
          unit: ms
      - launch: ${videoUri}
      - wait:
          duration: 2000
          unit: ms
      - native.video:
          tag: status-text
          equal: ready
          timeoutMs: 20000
      - aiAct:
          prompt: When scrolling, gesture within the light-gray video demo panel on the LEFT below the back arrow, not the white blank area to its right or below. Scroll if needed and click the single button labeled exactly "Play"
            once. Do not click similarly named buttons or perform another
            action.
          options:
            deepLocate: true
            cacheable: false
      - native.video:
          tag: status-text
          equal: playing
          timeoutMs: 20000
      - aiAct:
          prompt: When scrolling, gesture within the light-gray video demo panel on the LEFT below the back arrow, not the white blank area to its right or below. Scroll if needed and click the single button labeled exactly "Src B"
            once. Do not click similarly named buttons or perform another
            action.
          options:
            deepLocate: true
            cacheable: false
      - native.video:
          tag: event-counts
          countAtLeast:
            key: buffering
            value: 1
          timeoutMs: 10000
      - native.video:
          tag: status-text
          equal: ready
          timeoutMs: 20000
      - native.video:
          tag: attr-state
          contains: src=secondary
          timeoutMs: 20000
      - native.video:
          tag: event-counts
          countAtLeast:
            key: firstframe
            value: 1
          timeoutMs: 10000
      - recordToReport:
          title: "Original VideoBoundary diagnostic screenshot: src_secondary"
      - aiAct:
          prompt: When scrolling, gesture within the light-gray video demo panel on the LEFT below the back arrow, not the white blank area to its right or below. Scroll if needed and click the single button labeled exactly "Src Bad"
            once. Do not click similarly named buttons or perform another
            action.
          options:
            deepLocate: true
            cacheable: false
      - native.video:
          tag: status-text
          equal: error
          timeoutMs: 20000
      - native.video:
          tag: event-counts
          countAtLeast:
            key: error
            value: 1
          timeoutMs: 10000
      - native.video:
          tag: last-error
          errorDetails: true
          timeoutMs: 20000
      - aiAct:
          prompt: When scrolling, gesture within the light-gray video demo panel on the LEFT below the back arrow, not the white blank area to its right or below. Scroll if needed and click the single button labeled exactly "Src Empty"
            once. Do not click similarly named buttons or perform another
