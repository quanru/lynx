# Original xelement/VideoModes.py. No callback/order assertion is visual or relaxed.
# Each burst is ONE original button click, not multiple AI-paced video operations.
afterEach:
  - recordToReport: VideoModes final assertion evidence, including failures
cases:
  - name: xelement/VideoModes
    steps:
      - recordToReport: { title: Start isolated Explorer for VideoModes }
      - wait: { duration: 5000, unit: ms }
      - launch: "${videoUri}"
      - wait: { duration: 2000, unit: ms }
      - native.video: { tag: status-text, equal: ready }
      - aiAct:
          prompt: When scrolling, gesture within the light-gray video demo panel on the LEFT below the back arrow, not the white blank area to its right or below. Scroll if needed and click the video mode button labeled "Queue" once. Do not click any playback button.
          options: { effort: deepThink, deepLocate: "${videoDeepLocate}", cacheable: false }
      - native.video: { tag: attr-state, contains: "mode=queue" }
      - aiAct:
          prompt: Click the single button labeled "Play Pause Stop" once. Do not click the separate Play, Pause, or Stop buttons. Stop after that single click.
          options: { effort: deepThink, deepLocate: "${videoDeepLocate}", cacheable: false }
      - native.video: { tag: status-text, equal: stopped, timeoutMs: 15000 }
      - native.video: { tag: callback-log, contains: stop_ok }
      - native.video: { tag: callback-log, order: [play_ok, pause_ok, stop_ok], immediate: true }
      - native.video:
          tag: signal-log
          order: ["event:playing", "callback:play_ok", "event:paused", "callback:pause_ok", "event:stopped", "callback:stop_ok"]
          immediate: true
      - aiAct:
          prompt: When scrolling, gesture within the light-gray video demo panel on the LEFT below the back arrow, not the white blank area to its right or below. Scroll if needed and click the button labeled "Clear" once. Do not click any other button.
          options: { effort: deepThink, deepLocate: "${videoDeepLocate}", cacheable: false }
      - aiAct:
          prompt: When scrolling, gesture within the light-gray video demo panel on the LEFT below the back arrow, not the white blank area to its right or below. Scroll if needed and click the video mode button labeled "Latest" once. Do not click any playback button.
          options: { effort: deepThink, deepLocate: "${videoDeepLocate}", cacheable: false }
      - native.video: { tag: attr-state, contains: "mode=latest" }
      - aiAct:
          prompt: When scrolling, gesture within the light-gray video demo panel on the LEFT below the back arrow, not the white blank area to its right or below. Scroll if needed and click the single button labeled "Play Pause Stop" once. Do not click the separate Play, Pause, or Stop buttons. Stop after that single click.
          options: { effort: deepThink, deepLocate: "${videoDeepLocate}", cacheable: false }
      - native.video: { tag: status-text, equal: stopped, timeoutMs: 15000 }
      - native.video: { tag: callback-log, contains: stop_ok }
      - native.video: { tag: callback-log, notContains: pause_ok, immediate: true }
      - aiAct:
          prompt: When scrolling, gesture within the light-gray video demo panel on the LEFT below the back arrow, not the white blank area to its right or below. Scroll if needed and click the button labeled "Clear" once. Do not click any other button.
          options: { effort: deepThink, deepLocate: "${videoDeepLocate}", cacheable: false }
      - aiAct:
          prompt: When scrolling, gesture within the light-gray video demo panel on the LEFT below the back arrow, not the white blank area to its right or below. Scroll if needed and click the video mode button labeled "Direct" once. Do not click any playback button.
          options: { effort: deepThink, deepLocate: "${videoDeepLocate}", cacheable: false }
      - native.video: { tag: attr-state, contains: "mode=direct" }
      - aiAct:
          prompt: Click the single button labeled "Play Stop" once. Do not click "Play Pause Stop" or the separate playback buttons. Stop after that single click.
          options: { effort: deepThink, deepLocate: "${videoDeepLocate}", cacheable: false }
      - native.video: { tag: callback-log, contains: play_ok }
      - native.video: { tag: callback-log, contains: stop_ok }
      - native.video: { tag: callback-log, order: [play_ok, stop_ok], immediate: true }
      - aiAct:
          prompt: When scrolling, gesture within the light-gray video demo panel on the LEFT below the back arrow, not the white blank area to its right or below. Scroll if needed and click the button labeled "Clear" once. Do not click any other button.
          options: { effort: deepThink, deepLocate: "${videoDeepLocate}", cacheable: false }
      - aiAct:
          prompt: >-
            Click the single Seek 2s button once: it is the SECOND blue control in the seek row immediately below Clear / Play / Play Null / Pause / Stop, between Seek 0s and Near End. Its fixed-width label may be clipped to See; use the row and neighbors to identify it. The later fourth control labeled Seek is not Seek 2s. If that second button body is already on screen, do not scroll; scrolling cannot unclip its text. Do not click any other button. Stop after the single click.
          options: { effort: deepThink, deepLocate: false, cacheable: false }
      - native.video: { tag: callback-log, contains: seek_ok }
      - aiAct:
          prompt: Click the individual playback button labeled exactly "Stop" once. Do not click either combined burst button.
          options: { effort: deepThink, deepLocate: "${videoDeepLocate}", cacheable: false }
      - native.video: { tag: status-text, equal: stopped }
      - native.video: { tag: callback-log, contains: stop_ok }
      - recordToReport: { title: Original VideoModes direct-mode diagnostic screenshot }
