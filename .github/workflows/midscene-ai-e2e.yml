name: Midscene AI E2E (current-source Lynx Explorer)

# Build the current workflow revision, including integration pages and Sparkling.
# Coexists with the legacy Appium jobs in ci.yml — neither replaces the other.
#   Android: Midscene -> adb directly (no Appium / Espresso re-signing)
#   iOS:     Midscene -> WebDriverAgent directly (no Appium / xcuitest driver)
#
# Required repository secrets:
#   MIDSCENE_MODEL_API_KEY / NAME / BASE_URL / FAMILY
# Optional:
#   MIDSCENE_MODEL_REASONING_ENABLED
# Optional repository variables:
#   MIDSCENE_PAGES_BRANCH  e.g. "develop" — publish HTML report to GitHub Pages
#                          (defaults to the repository default branch).
#                          Same-repository pull
#                          requests also publish review evidence.

on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths: &ai-e2e-paths
      - '.github/workflows/midscene-ai-e2e.yml'
      - 'testing/ai_e2e/**'
      - 'testing/integration_test/demo_pages/**'
      - 'explorer/**'
      - 'core/**'
      - 'devtool/**'
      - 'platform/android/**'
      - 'platform/darwin/**'
      - 'dependencies/**'
      - 'tools/**'
      - '.habitat'
  pull_request:
    branches: [develop]
    paths: *ai-e2e-paths

permissions:
  contents: read

concurrency:
  group: midscene-ai-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_OPTIONS: --dns-result-order=ipv4first --no-network-family-autoselection

jobs:
  build-explorer:
    name: Build current-source Explorer · ${{ matrix.platform }}
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            os: ubuntu-22.04
          - platform: ios
            os: macos-15
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      # Habitat uses the repository-pinned Node 18 toolchain for build hooks.
      NODE_OPTIONS: --dns-result-order=ipv4first
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: lynx
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Install public build prerequisites
        working-directory: lynx
        run: |
          python3 -m pip install -r tools/vpython_tools/requirements.txt
          git config --global url."https://github.com/".insteadOf "git@github.com:"
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.habitat_cache
          key: midscene-habitat-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lynx/.habitat', 'lynx/dependencies/**') }}
          restore-keys: midscene-habitat-${{ runner.os }}-${{ runner.arch }}-
      - name: Synchronize pinned source and build tools
        working-directory: lynx
        env:
          HABITAT_CONCURRENCY: '2'
        run: tools/hab sync . --target sparkling,tools_shared
      - name: Install Android SDK components
        if: matrix.platform == 'android'
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;21.1.6352462" "platforms;android-33" "build-tools;29.0.2"'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        if: matrix.platform == 'android'
        with:
          java-version: '11'
          distribution: zulu
      - name: Build source Explorer with integration fixtures
        working-directory: lynx
        run: bash testing/ai_e2e/scripts/build-explorer.sh '${{ matrix.platform }}' "$RUNNER_TEMP/explorer-build"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: midscene-explorer-source-${{ matrix.platform }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/explorer-build/LynxExplorer.apk
            ${{ runner.temp }}/explorer-build/LynxExplorer.app.tar.gz
            ${{ runner.temp }}/explorer-build/build.json
          if-no-files-found: error
          retention-days: 14

  fork-contract-check:
    name: Midscene contract check (external fork)
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
      - name: Check types and report contract without model credentials
        working-directory: testing/ai_e2e
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          node --test scripts/*.test.mjs

  android-ai-e2e:
    name: Midscene AI E2E · Android (Explorer)
    needs: build-explorer
    if: always() && !cancelled() && needs.build-explorer.result != 'skipped' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      MIDSCENE_MODEL_API_KEY: ${{ secrets.MIDSCENE_MODEL_API_KEY }}
      MIDSCENE_MODEL_NAME: ${{ secrets.MIDSCENE_MODEL_NAME }}
      MIDSCENE_MODEL_BASE_URL: ${{ secrets.MIDSCENE_MODEL_BASE_URL }}
      MIDSCENE_MODEL_FAMILY: ${{ secrets.MIDSCENE_MODEL_FAMILY }}
      MIDSCENE_MODEL_REASONING_ENABLED: ${{ secrets.MIDSCENE_MODEL_REASONING_ENABLED }}
      ANDROID_API: '30'
      ANDROID_ABI: x86_64
      AVD_NAME: lynx_midscene
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: testing/ai_e2e/package-lock.json

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '17'
          distribution: zulu

      - name: Download current-source Explorer APK
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: midscene-explorer-source-android-*
          path: testing/ai_e2e/source-builds
          merge-multiple: false
      - name: Verify Explorer build revision and checksum
        working-directory: testing/ai_e2e
        run: node scripts/verify-build.mjs source-builds android .

      - name: Preflight model endpoint
        run: bash testing/ai_e2e/scripts/preflight-model.sh

      - name: Start headless Android emulator
        working-directory: testing/ai_e2e
        timeout-minutes: 20
        run: bash scripts/start-android-emulator.sh

      - name: Install Explorer
        working-directory: testing/ai_e2e
        run: |
          "$ANDROID_HOME/platform-tools/adb" wait-for-device
          "$ANDROID_HOME/platform-tools/adb" install -r -g LynxExplorer.apk

      - name: Install Midscene test dependencies
        working-directory: testing/ai_e2e
        run: |
          for attempt in 1 2 3; do
            npm ci --no-audit --no-fund && exit 0
            echo "npm ci attempt $attempt failed; retrying." >&2
            sleep 10
          done
          echo "::error:: npm ci failed after 3 attempts" >&2
          latest_log="$(find "$HOME/.npm/_logs" -maxdepth 1 -type f -name '*-debug-0.log' -print 2>/dev/null | sort | tail -n 1)"
          if [ -n "$latest_log" ]; then tail -n 80 "$latest_log"; fi
          exit 1

      - name: Run Android Midscene cases
        id: run-cases
        working-directory: testing/ai_e2e
        run: npm test -- --project android-explorer

      - name: Stage Android report for this attempt
        if: always()
        run: |
          target="$RUNNER_TEMP/midscene-upload/android/attempt-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$target"
          printf '%s\n' "$GITHUB_RUN_ATTEMPT" > "$target/attempt.txt"
          if [ -d testing/ai_e2e/midscene_run ]; then
            cp -R testing/ai_e2e/midscene_run/. "$target"/
          fi
          if [ -f testing/ai_e2e/build.json ]; then cp testing/ai_e2e/build.json "$target"/; fi

      - name: Upload Android report
        id: upload-report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: midscene-ai-e2e-android-${{ github.run_attempt }}
          path: ${{ runner.temp }}/midscene-upload/android
          if-no-files-found: warn
          retention-days: 14

      - name: Add Android results to the job Summary
        if: always()
        env:
          PRODUCER_RESULT: ${{ steps.run-cases.outcome == 'success' && steps.upload-report.outcome == 'success' && 'success' || 'failure' }}
        run: |
          node testing/ai_e2e/scripts/render-ci-summary.mjs \
            --title "Lynx Explorer × Midscene · Android" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --links-published false \
            --entry "Android=testing/ai_e2e/midscene_run" \
            --result "Android=$PRODUCER_RESULT" \
            --artifact "Android=midscene-ai-e2e-android-$GITHUB_RUN_ATTEMPT" \
            --site-prefix "runs/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --site-dir "$RUNNER_TEMP/midscene-job-summary" \
            --job-summary-only true \
            --output "$GITHUB_STEP_SUMMARY"

      - name: Upload emulator log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: midscene-ai-e2e-log-android-emulator-${{ github.run_attempt }}
          path: testing/ai_e2e/emulator.log
          if-no-files-found: ignore
          retention-days: 14

  ios-ai-e2e:
    name: Midscene AI E2E · iOS (Explorer)
    needs: build-explorer
    if: always() && !cancelled() && needs.build-explorer.result != 'skipped' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: macos-15
    timeout-minutes: 60
    env:
      MIDSCENE_MODEL_API_KEY: ${{ secrets.MIDSCENE_MODEL_API_KEY }}
      MIDSCENE_MODEL_NAME: ${{ secrets.MIDSCENE_MODEL_NAME }}
      MIDSCENE_MODEL_BASE_URL: ${{ secrets.MIDSCENE_MODEL_BASE_URL }}
      MIDSCENE_MODEL_FAMILY: ${{ secrets.MIDSCENE_MODEL_FAMILY }}
      MIDSCENE_MODEL_REASONING_ENABLED: ${{ secrets.MIDSCENE_MODEL_REASONING_ENABLED }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: testing/ai_e2e/package-lock.json

      - name: Preflight model endpoint
        run: bash testing/ai_e2e/scripts/preflight-model.sh

      - name: Show toolchain
        run: |
          xcodebuild -version
          uname -m

      - name: Download current-source Explorer app
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: midscene-explorer-source-ios-*
          path: testing/ai_e2e/source-builds
          merge-multiple: false
      - name: Verify and unpack current-source Explorer
        working-directory: testing/ai_e2e
        run: |
          node scripts/verify-build.mjs source-builds ios .
          tar -xzf LynxExplorer.app.tar.gz

      - name: Build and start WebDriverAgent
        working-directory: testing/ai_e2e
        env:
          WDA_WORKDIR: ${{ runner.temp }}/wda-build
        run: bash scripts/start-wda.sh

      - name: Install Explorer on simulator
        working-directory: testing/ai_e2e
        run: xcrun simctl install "$SIMULATOR_UDID" LynxExplorer.app

      - name: Install Midscene test dependencies
        working-directory: testing/ai_e2e
        run: |
          for attempt in 1 2 3; do
            npm ci --no-audit --no-fund && exit 0
            echo "npm ci attempt $attempt failed; retrying." >&2
            sleep 10
          done
          echo "::error:: npm ci failed after 3 attempts" >&2
          latest_log="$(find "$HOME/.npm/_logs" -maxdepth 1 -type f -name '*-debug-0.log' -print 2>/dev/null | sort | tail -n 1)"
          if [ -n "$latest_log" ]; then tail -n 80 "$latest_log"; fi
          exit 1

      - name: Run iOS Midscene cases
        id: run-cases
        working-directory: testing/ai_e2e
        run: npm test -- --project ios-explorer

      - name: Stage iOS report for this attempt
        if: always()
        run: |
          target="$RUNNER_TEMP/midscene-upload/ios/attempt-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$target"
          printf '%s\n' "$GITHUB_RUN_ATTEMPT" > "$target/attempt.txt"
          if [ -d testing/ai_e2e/midscene_run ]; then
            cp -R testing/ai_e2e/midscene_run/. "$target"/
          fi
          if [ -f testing/ai_e2e/build.json ]; then cp testing/ai_e2e/build.json "$target"/; fi

      - name: Upload iOS report
        id: upload-report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: midscene-ai-e2e-ios-${{ github.run_attempt }}
          path: ${{ runner.temp }}/midscene-upload/ios
          if-no-files-found: warn
          retention-days: 14

      - name: Add iOS results to the job Summary
        if: always()
        env:
          PRODUCER_RESULT: ${{ steps.run-cases.outcome == 'success' && steps.upload-report.outcome == 'success' && 'success' || 'failure' }}
        run: |
          node testing/ai_e2e/scripts/render-ci-summary.mjs \
            --title "Lynx Explorer × Midscene · iOS" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --links-published false \
            --entry "iOS=testing/ai_e2e/midscene_run" \
            --result "iOS=$PRODUCER_RESULT" \
            --artifact "iOS=midscene-ai-e2e-ios-$GITHUB_RUN_ATTEMPT" \
            --site-prefix "runs/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --site-dir "$RUNNER_TEMP/midscene-job-summary" \
            --job-summary-only true \
            --output "$GITHUB_STEP_SUMMARY"

      - name: Upload WDA log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: midscene-ai-e2e-log-ios-wda-${{ github.run_attempt }}
          path: ${{ runner.temp }}/wda-build/wda.log
          if-no-files-found: ignore
          retention-days: 14

  report-bundle:
    name: Assemble Midscene report bundle
    needs: [android-ai-e2e, ios-ai-e2e]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download Android report
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: midscene-ai-e2e-android-*
          path: ${{ runner.temp }}/midscene-artifacts/android
          merge-multiple: true

      - name: Download iOS report
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: midscene-ai-e2e-ios-*
          path: ${{ runner.temp }}/midscene-artifacts/ios
          merge-multiple: true

      - name: Select latest report attempt per platform
        run: |
          select_latest() {
            local platform="$1"
            local source="$RUNNER_TEMP/midscene-artifacts/$platform"
            local target="$RUNNER_TEMP/midscene-reports/midscene-ai-e2e-$platform"
            local latest=""
            if [ -d "$source" ]; then
              latest="$(find "$source" -mindepth 1 -maxdepth 1 -type d \
                -name 'attempt-*' -print | sort -V | tail -n 1)"
            fi
            if [ -n "$latest" ]; then
              mkdir -p "$target"
              cp -R "$latest"/. "$target"/
            fi
          }
          select_latest android
          select_latest ios

      - name: Stage combined report bundle for this attempt
        run: |
          target="$RUNNER_TEMP/midscene-bundle-upload/attempt-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$target"
          printf '%s\n' "$GITHUB_RUN_ATTEMPT" > "$target/attempt.txt"
          if [ -d "$RUNNER_TEMP/midscene-reports" ]; then
            cp -R "$RUNNER_TEMP/midscene-reports"/. "$target"/
          fi

      - name: Upload combined report bundle
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: midscene-ai-e2e-report-${{ github.run_attempt }}
          path: ${{ runner.temp }}/midscene-bundle-upload
          if-no-files-found: warn
          retention-days: 30

  pages-report:
    name: Publish report and evidence summary
    needs: [android-ai-e2e, ios-ai-e2e, report-bundle]
    concurrency:
      group: midscene-pages-archive
      cancel-in-progress: false
    if: >-
      always() &&
      !cancelled() &&
      needs.report-bundle.result == 'success' &&
      ((github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name != 'pull_request' &&
      github.ref_name == (vars.MIDSCENE_PAGES_BRANCH || github.event.repository.default_branch)))
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: testing/ai_e2e/package-lock.json

      - name: Install Midscene report dependencies
        working-directory: testing/ai_e2e
        run: npm ci --no-audit --no-fund

      - name: Download combined report bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: midscene-ai-e2e-report-*
          path: ${{ runner.temp }}/midscene-bundles
          merge-multiple: true

      - name: Select latest combined report bundle
        run: |
          latest="$(find "$RUNNER_TEMP/midscene-bundles" \
            -mindepth 1 -maxdepth 1 -type d \
            -name 'attempt-*' -print | sort -V | tail -n 1)"
          test -n "$latest"
          mkdir -p "$RUNNER_TEMP/midscene-reports"
          cp -R "$latest"/. "$RUNNER_TEMP/midscene-reports"/

      - id: pages
        continue-on-error: true
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: false

      - name: Explain unavailable Pages
        if: steps.pages.outcome != 'success'
        run: |
          message="GitHub Pages is unavailable. Select Settings > Pages > Build and deployment > Source > GitHub Actions."
          echo "::warning::$message"
          echo "$message Results and reports remain available in test job Summaries and Actions artifacts." >> "$GITHUB_STEP_SUMMARY"

      - name: Test the evidence renderer
        if: steps.pages.outcome == 'success'
        run: node --test testing/ai_e2e/scripts/*.test.mjs

      - name: Restore previously published reports
        if: steps.pages.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          archive="$RUNNER_TEMP/midscene-pages-archive"
          site="$RUNNER_TEMP/pages-site"
          git init "$archive"
          git -C "$archive" remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          mkdir -p "$site"
          status=0
          git -C "$archive" ls-remote --exit-code origin refs/heads/midscene-pages-archive || status=$?
          if [ "$status" = 0 ]; then
            git -C "$archive" fetch --depth=1 origin refs/heads/midscene-pages-archive
            git -C "$archive" checkout -b midscene-pages-archive FETCH_HEAD
            git -C "$archive" archive HEAD | tar -xf - -C "$site"
          elif [ "$status" = 2 ]; then
            git -C "$archive" checkout --orphan midscene-pages-archive
          else
            exit "$status"
          fi

      - name: Build native Midscene report and linked screenshot summary
        if: steps.pages.outcome == 'success'
        env:
          ANDROID_RESULT: ${{ needs.android-ai-e2e.result }}
          IOS_RESULT: ${{ needs.ios-ai-e2e.result }}
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node testing/ai_e2e/scripts/render-ci-summary.mjs \
            --title "Lynx Explorer × Midscene" \
            --run-url "$RUN_URL" \
            --pages-url "$PAGES_URL" \
            --entry "Android=$RUNNER_TEMP/midscene-reports/midscene-ai-e2e-android" \
            --result "Android=$ANDROID_RESULT" \
            --artifact "Android=midscene-ai-e2e-android-$GITHUB_RUN_ATTEMPT" \
            --entry "iOS=$RUNNER_TEMP/midscene-reports/midscene-ai-e2e-ios" \
            --result "iOS=$IOS_RESULT" \
            --artifact "iOS=midscene-ai-e2e-ios-$GITHUB_RUN_ATTEMPT" \
            --site-prefix "runs/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --site-dir "$RUNNER_TEMP/pages-site" \
            --output "$RUNNER_TEMP/published-summary.md"

      - name: Persist report archive
        if: steps.pages.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="$RUNNER_TEMP/midscene-pages-archive"
          cp -R "$RUNNER_TEMP/pages-site"/. "$archive"/
          git -C "$archive" config user.name github-actions[bot]
          git -C "$archive" config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C "$archive" add -A
          git -C "$archive" commit -m "docs: archive Midscene report $GITHUB_RUN_ID attempt $GITHUB_RUN_ATTEMPT"
          git -C "$archive" push origin HEAD:refs/heads/midscene-pages-archive

      - if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          name: midscene-pages-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pages-site
      - id: deployment
        if: steps.pages.outcome == 'success'
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        with:
          artifact_name: midscene-pages-${{ github.run_attempt }}

      - name: Add published report evidence to Summary
        if: steps.deployment.outcome == 'success'
        run: cat "$RUNNER_TEMP/published-summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Explain publication failure
        if: failure()
        run: |
          echo '❌ Pages publication failed. Download the combined report artifact from this run. Check Pages setup and the github-pages environment deployment rules.' >> "$GITHUB_STEP_SUMMARY"
